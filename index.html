    <meta name="author" content="Буржуйка" />

    <meta property="og:type" content="website" />

        "@type": "PostalAddress",

      "areaServed": {

      },

        "@type": "OfferCatalog",

          { "@type": "Offer", "itemOffered": { "@type": "Product", "name": "Печі для саун" } },

        ]
